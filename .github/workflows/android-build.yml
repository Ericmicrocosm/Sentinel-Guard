
name: Sentinel Guard Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Sentinel Guard source code
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project structure
        run: flutter create --platforms=android --project-name sentinel_guard build_workspace

      - name: Copy Sentinel Guard application files
        run: |
          cp pubspec.yaml build_workspace/pubspec.yaml
          cp -r lib build_workspace/lib

      - name: Download Flutter packages
        working-directory: build_workspace
        run: flutter pub get

      - name: Build Android APK
        working-directory: build_workspace
        run: flutter build apk --release

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-guard-android
          path: build_workspace/build/app/outputs/flutter-apk/app-release.apk
